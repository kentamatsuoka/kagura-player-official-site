name: Deploy YOMUVIA site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yomuvia-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish gh-pages
        env:
          PUBLIC_SITE_ORIGIN: https://yomuvia.com
          PUBLIC_BASE_PATH: /
          PUBLIC_DOWNLOAD_URL: https://api.yomuvia.com/download/windows/latest
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: 161DF3CE0CBD753E9A1BE521F49429AB
          PUBLIC_MONTHLY_CHECKOUT_URL: https://buy.stripe.com/14A3co0dwgZse7T4WIes000
          PUBLIC_ANNUAL_CHECKOUT_URL: https://buy.stripe.com/3cI14ge4m38C8NzgFqes001
        run: npm run publish
